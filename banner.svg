<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0a0a1a"/>
      <stop offset="40%"  stop-color="#0d1b3e"/>
      <stop offset="100%" stop-color="#0a0a1a"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#00d4ff"/>
      <stop offset="50%"  stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ff6b6b"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#00d4ff" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#a855f7" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ff6b6b" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="orb1" cx="50%" cy="50%">
      <stop offset="0%"   stop-color="#a855f7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="50%" cy="50%">
      <stop offset="0%"   stop-color="#00d4ff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb3" cx="50%" cy="50%">
      <stop offset="0%"   stop-color="#ff6b6b" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ff6b6b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)"/>

  <!-- Ambient orbs -->
  <ellipse cx="200"  cy="200" rx="220" ry="220" fill="url(#orb2)">
    <animate attributeName="rx" values="220;260;220" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="ry" values="220;180;220" dur="6s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="600"  cy="180" rx="280" ry="280" fill="url(#orb1)">
    <animate attributeName="rx" values="280;320;280" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="ry" values="280;240;280" dur="8s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="1050" cy="220" rx="200" ry="200" fill="url(#orb3)">
    <animate attributeName="rx" values="200;240;200" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="ry" values="200;170;200" dur="5s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Grid lines (subtle) -->
  <g stroke="#ffffff" stroke-width="0.3" stroke-opacity="0.05">
    <line x1="0" y1="80"  x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="150"  y1="0" x2="150"  y2="400"/>
    <line x1="300"  y1="0" x2="300"  y2="400"/>
    <line x1="450"  y1="0" x2="450"  y2="400"/>
    <line x1="600"  y1="0" x2="600"  y2="400"/>
    <line x1="750"  y1="0" x2="750"  y2="400"/>
    <line x1="900"  y1="0" x2="900"  y2="400"/>
    <line x1="1050" y1="0" x2="1050" y2="400"/>
  </g>

  <!-- Neural network nodes — left cluster -->
  <g filter="url(#glow)">
    <circle cx="60"  cy="120" r="5" fill="#00d4ff" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.4;0.9" dur="2.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="110" cy="80"  r="4" fill="#a855f7" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="3.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="170" r="6" fill="#00d4ff" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="2.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="155" cy="130" r="4" fill="#ff6b6b" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.5;0.9" dur="1.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="60"  cy="220" r="5" fill="#a855f7" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="3.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="260" r="4" fill="#00d4ff" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <!-- Connecting lines -->
    <line x1="60"  y1="120" x2="110" y2="80"  stroke="#00d4ff" stroke-width="1" opacity="0.3"/>
    <line x1="60"  y1="120" x2="100" y2="170" stroke="#00d4ff" stroke-width="1" opacity="0.3"/>
    <line x1="110" y1="80"  x2="155" y2="130" stroke="#a855f7" stroke-width="1" opacity="0.3"/>
    <line x1="100" y1="170" x2="155" y2="130" stroke="#a855f7" stroke-width="1" opacity="0.3"/>
    <line x1="60"  y1="220" x2="100" y2="170" stroke="#ff6b6b" stroke-width="1" opacity="0.3"/>
    <line x1="60"  y1="220" x2="120" y2="260" stroke="#ff6b6b" stroke-width="1" opacity="0.3"/>
    <line x1="120" y1="260" x2="155" y2="130" stroke="#a855f7" stroke-width="0.8" opacity="0.2"/>
  </g>

  <!-- Neural network nodes — right cluster -->
  <g filter="url(#glow)">
    <circle cx="1140" cy="130" r="5" fill="#ff6b6b" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.4;0.9" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1090" cy="85"  r="4" fill="#a855f7" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="3.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1100" cy="175" r="6" fill="#00d4ff" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="2.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1045" cy="135" r="4" fill="#00d4ff" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.5;0.9" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1140" cy="230" r="5" fill="#a855f7" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="3.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1080" cy="265" r="4" fill="#ff6b6b" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <line x1="1140" y1="130" x2="1090" y2="85"  stroke="#ff6b6b" stroke-width="1" opacity="0.3"/>
    <line x1="1140" y1="130" x2="1100" y2="175" stroke="#ff6b6b" stroke-width="1" opacity="0.3"/>
    <line x1="1090" y1="85"  x2="1045" y2="135" stroke="#a855f7" stroke-width="1" opacity="0.3"/>
    <line x1="1100" y1="175" x2="1045" y2="135" stroke="#a855f7" stroke-width="1" opacity="0.3"/>
    <line x1="1140" y1="230" x2="1100" y2="175" stroke="#00d4ff" stroke-width="1" opacity="0.3"/>
    <line x1="1140" y1="230" x2="1080" y2="265" stroke="#00d4ff" stroke-width="1" opacity="0.3"/>
    <line x1="1080" y1="265" x2="1045" y2="135" stroke="#a855f7" stroke-width="0.8" opacity="0.2"/>
  </g>

  <!-- Floating data particles -->
  <g fill="#00d4ff" opacity="0.6" filter="url(#glow)">
    <circle cx="300" cy="50" r="2"><animate attributeName="cy" values="50;30;50" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="500" cy="360" r="1.5"><animate attributeName="cy" values="360;340;360" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="800" cy="40" r="2"><animate attributeName="cy" values="40;60;40" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="950" cy="350" r="1.5"><animate attributeName="cy" values="350;370;350" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="380" r="2"><animate attributeName="cy" values="380;360;380" dur="3s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Lightning bolt icon -->
  <text x="540" y="148" font-family="Arial Black, sans-serif" font-size="52" fill="url(#textGrad)" filter="url(#softglow)" text-anchor="middle" font-weight="900">⚡</text>

  <!-- Main title -->
  <text x="600" y="210" font-family="Arial Black, sans-serif" font-size="86" fill="url(#textGrad)" filter="url(#softglow)" text-anchor="middle" font-weight="900" letter-spacing="4">LowMind</text>

  <!-- Animated underline -->
  <rect x="200" y="222" width="800" height="3" rx="2" fill="url(#lineGrad)">
    <animate attributeName="width" values="0;800;0" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="x"    values="600;200;600" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- Subtitle -->
  <text x="600" y="268" font-family="Arial, sans-serif" font-size="22" fill="#94a3b8" text-anchor="middle" letter-spacing="2">
    Ultra-Lightweight Deep Learning · Pure NumPy · Edge AI
  </text>

  <!-- Three feature pills -->
  <g transform="translate(600,310)">
    <!-- Pill 1 -->
    <rect x="-310" y="0" width="185" height="36" rx="18" fill="#00d4ff" fill-opacity="0.12" stroke="#00d4ff" stroke-width="1" stroke-opacity="0.6"/>
    <text x="-218" y="23" font-family="Arial, sans-serif" font-size="13" fill="#00d4ff" text-anchor="middle" font-weight="600">🍓 Raspberry Pi Native</text>
    <!-- Pill 2 -->
    <rect x="-88" y="0" width="175" height="36" rx="18" fill="#a855f7" fill-opacity="0.12" stroke="#a855f7" stroke-width="1" stroke-opacity="0.6"/>
    <text x="0" y="23" font-family="Arial, sans-serif" font-size="13" fill="#a855f7" text-anchor="middle" font-weight="600">⚡ PyTorch-like API</text>
    <!-- Pill 3 -->
    <rect x="92" y="0" width="165" height="36" rx="18" fill="#ff6b6b" fill-opacity="0.12" stroke="#ff6b6b" stroke-width="1" stroke-opacity="0.6"/>
    <text x="175" y="23" font-family="Arial, sans-serif" font-size="13" fill="#ff6b6b" text-anchor="middle" font-weight="600">📦 Only ~3 MB Install</text>
  </g>

  <!-- Corner decorations -->
  <g stroke="#00d4ff" stroke-width="2" fill="none" opacity="0.4">
    <polyline points="10,10 10,40 40,40"/>
    <polyline points="1190,10 1190,40 1160,40"/>
    <polyline points="10,390 10,360 40,360"/>
    <polyline points="1190,390 1190,360 1160,360"/>
  </g>
</svg>
