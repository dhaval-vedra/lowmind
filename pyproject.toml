[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "lowmind"
version = "2.1.0"
description = "Ultra-lightweight deep learning framework for Raspberry Pi and embedded systems"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Dhaval Vedra" }]
requires-python = ">=3.9"
keywords = ["deep-learning", "neural-network", "numpy", "autograd", "raspberry-pi", "embedded", "machine-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov", "black", "isort", "mypy"]
viz = ["matplotlib"]

[project.urls]
Homepage = "https://github.com/dhaval-vedra/lowmind"
Documentation = "https://github.com/dhaval-vedra/lowmind#readme"
Repository = "https://github.com/dhaval-vedra/lowmind"
"Bug Tracker" = "https://github.com/dhaval-vedra/lowmind/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
warn_return_any = false
